# @package _global_
#
# Functional PCA on CelebA-HQ faces at 64x64, treated as functions on [0,1]^2
# sampled at irregular coordinates rather than as pixel grids. Uses a 3-channel
# Fourier dictionary under an Eulerian isometry.
#
# The dataset streams from HuggingFace (mattymchen/celeba-hq) on first use, so
# no manual download step is required.
#
# Usage:
#   python fpca.py +fpca_experiment=celeba_eulerian
#   python fpca.py +fpca_experiment=celeba_eulerian wandb=enabled wandb.run_name=celeba_fpca

defaults:
  - /function_generator@function_generator: celeba
  - /neural_isometry@neural_isometry: eulerian
  - _self_


function_generator:
  resolution: 64
  n_images: 1024
  drop_fraction: 0.0
  n_drop_draws: 1

# ── 3-channel overrides ───────────────────────────────────────────────────────

# Eulerian isometry must match the signal channel count
neural_isometry:
  channels_dim: 3
  # scalar_field_partial: null
  rank: 10

# Fourier dictionary: 3 output channels (R,G,B).  Atoms are indexed by
# (k_1, k_2, c) — scalar spatial function phi_k active only in channel c.
initial_dictionary:
  num_channels: 3
  steepness: 1.01

# Mean function outputs one value per RGB channel
mean_function:
  output_dim: 3

# ── Training hyperparameters ──────────────────────────────────────────────────
checkpointing:
  checkpoint_dir: outputs/checkpoints
  checkpoint_every_n_steps: 20


# Fixed ordered prefix e_1..e_K pushed through the isometry (K >= rank).
num_atoms: 4096
n_epochs: 6000
n_epochs_mean_function: null  # freeze mean function after this many epochs (null = never)
batch_size: 16
grad_accumulation_steps: 32
max_grad_norm: 1.0

wandb:
  project: BasisLearning-FPCA
  tags:
    dataset: celeba
