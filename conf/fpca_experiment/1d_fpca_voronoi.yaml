# @package _global_
#
# Functional PCA on a 1-D synthetic dataset of tent + sine functions.
#
#     f(x) = sin(2π k x) + 2x          for x ≤ 0.5
#     f(x) = sin(2π k (1-x)) + 2(1-x)  for x > 0.5
#     k ~ shifted Geometric(p) on {1, 2, 3, ...}
#
# The function is symmetric about x=0.5 with a kink there. This variant uses a
# piecewise-constant Voronoi dictionary, which resolves the kink with far fewer
# atoms than a smooth basis needs.
#
# Usage:
#   python fpca.py +fpca_experiment=1d_fpca_voronoi
#   python fpca.py +fpca_experiment=1d_fpca_voronoi wandb=enabled wandb.run_name=1d_voronoi

defaults:
  - /neural_isometry@neural_isometry: eulerian
  - override /dictionaries@initial_dictionary: voronoi_1d
  - _self_

# ── Dataset ──────────────────────────────────────────────────────────────────
function_generator:
  _target_: infidictionary.datasets.OneDimDiscontinuousGenerator
  domain_sample_size: 128
  p: 0.5
  n_functions: 4096
  seed: 42
  random_sign: true   # flip to true → dataset becomes zero-mean by construction

# ── Mean function (1-D input) ─────────────────────────────────────────────────
mean_function:
  coords_dim: 1
  output_dim: 1

# ── Neural isometry (1-D, rank-10 Eulerian) ──────────────────────────────────
# The Voronoi dictionary has only 10 atoms, so the rank is capped by K >= R.
neural_isometry:
  coords_dim: 1
  channels_dim: 1
  rank: 10

# ── Training ──────────────────────────────────────────────────────────────────
n_epochs: 4000
batch_size: 16
grad_accumulation_steps: 4
max_grad_norm: 1.0

# Fixed ordered prefix e_1..e_K pushed through the isometry (K >= rank).
num_atoms: 10

checkpointing:
  checkpoint_dir: outputs/checkpoints
  checkpoint_every_n_steps: 100
  checkpoint_window_size: 3 # keep everything

wandb:
  project: BasisLearning-FPCA
  tags:
    dataset: oned_tent_sine
