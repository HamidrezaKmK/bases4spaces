# A ChainedIsometry: composition Q = Q_2 ∘ Q_1 (Q_1 applied first on
# pushforward, inverted last on pullback). Link 1 is a spatially-varying
# channel-mixing orthogonal map; link 2 is an EulerianIsometry driven by a
# conditional generator. Every hyperparameter is set explicitly
# here — nothing is left to a code default.
#
# Note: unlike `eulerian.yaml`, coords_dim / channels_dim are NOT top-level keys
# (ChainedIsometry takes only an `isometries` list). To change them downstream,
# override per-link, e.g.:
#   neural_isometry.isometries.0.coords_dim=1 neural_isometry.isometries.1.coords_dim=1
_target_: infidictionary.neural_isometries.ChainedIsometry

coords_dim: 2
channels_dim: 1

isometries_partial:
  # ── Link 1: spatially-varying channel mixing ────────────────────────────────
  - _target_: infidictionary.neural_isometries.ChannelOrthogonalIsometry
    _partial_: true
    hidden_dims: [64, 64]
    activation:
      _target_: torch.nn.SiLU
      _partial_: true

  # ── Link 2: Eulerian flow with a NeRF spatio-temporal generator ─────────────
  - _target_: infidictionary.neural_isometries.EulerianIsometry
    _partial_: true
    rank: 10
    base_acceleration: 5.0          # keeps ½·Δt·a·‖G·A‖ < 1, so the R×R Woodbury solve stays well-conditioned
    gradient_checkpointing: true
    n_time_freqs: 256
    kr_hidden_dims: [64, 64]
    max_gen_norm: 1.0               # soft Frobenius cap on the skew-symmetric generator
    scalar_field_partial:
      _target_: infidictionary.networks.NerfConditionalField
      _partial_: true
      hidden_dims: [256, 256, 256]
      activation:
        _target_: torch.nn.SiLU
        _partial_: true
      nerf_n_levels: 8
      nerf_n_base: 64
      nerf_freq_min: 1.0
      nerf_freq_max: 24.0
