defaults:
  - neural_fields@mean_function: nerf_field
  - hydra: default
  - wandb: disabled # set to enabled for wandb logging
  - /dictionaries@initial_dictionary: fourier_2d
  - _self_
  - override hydra/hydra_logging: none # hack to fix the logging code
  - override hydra/job_logging: none # hack to fix the logging code

mean_function_optimizer_callable:
  _target_: torch.optim.Adam
  lr: 0.001
  _partial_: true
mean_function_scheduler_callable: null

isometry_optimizer_callable:
  _target_: torch.optim.Adam
  lr: 0.001
  _partial_: true
isometry_scheduler_callable: null


# Size K of the fixed, ordered dictionary prefix e_1..e_K pushed through the
# isometry each step; its captured energy is weighted by the atom PMFs. K >= rank.
# Cost: every step pushes a (K, N, C) tensor through all layers (and again in
# the backward pass), so step time grows linearly with K * N * C. The PMF
# weights decay fast, so a few hundred atoms carry most of the objective; keep
# K modest (hundreds, not thousands) for high-resolution data.
num_atoms: 64
# Number R of mixing tokens: the first R prefix atoms build each layer's rotation.
# It is a call argument of the isometry, not part of the model.
rank: 10

wandb:
  tags:
    experiment: fpca
    task: reconstruction

# training hyperparameters
n_epochs: 500000
n_epochs_mean_function: null  # freeze mean function after this many epochs (null = never)
batch_size: 16
grad_accumulation_steps: 1
max_grad_norm: 1.0

resume_training:
  enabled: false
  checkpoint_path: null  # absolute path to a checkpoint .pt file

checkpointing:
  checkpoint_dir: outputs/checkpoints  # relative to Hydra output dir
  checkpoint_every_n_steps: 100  # optimizer steps between periodic saves
  checkpoint_window_size: 3       # number of periodic checkpoints to keep
